<script>
    const TMDB_API_KEY = 'b9b1bba28890e19391f15763ac33de7e'; 
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    const urlParams = new URLSearchParams(window.location.search);
    const tmdbId = urlParams.get('id');
    const type = urlParams.get('type') || 'movie'; 
    let currentSeason = parseInt(urlParams.get('s')) || 1;
    let currentEpisode = parseInt(urlParams.get('e')) || 1;
    let maxEpisodesInSeason = 1; 

    const playerIframe = document.getElementById('vidsrcEngine');

    if (tmdbId) {
        updatePlayerSource();
        fetchContentDetails();
        fetchRecommendations();
    } else {
        window.location.href = 'index.html';
    }

    function updatePlayerSource() {
        if (type === 'movie') {
            // Gunakan provider embed yang stabil
            playerIframe.src = `https://www.2embed.cc/embed/${tmdbId}`;
            document.getElementById('tvNavGroup').style.display = 'none'; 
        } else if (type === 'tv') {
            playerIframe.src = `https://www.2embed.cc/embedtv/${tmdbId}/${currentSeason}/${currentEpisode}`;
            document.getElementById('tvNavGroup').style.display = 'flex'; 
        }
    }

    function fetchContentDetails() {
        fetch(`${BASE_URL}/${type}/${tmdbId}?api_key=${TMDB_API_KEY}&language=id-ID`)
            .then(res => res.json())
            .then(data => {
                const title = data.title || data.name;
                
                if (type === 'movie') {
                    document.getElementById('streamTitle').innerText = title;
                    document.getElementById('streamMeta').innerText = `Rilis: ${data.release_date || 'N/A'} | Rating: ⭐ ${data.vote_average ? data.vote_average.toFixed(1) : '0.0'}`;
                } else {
                    document.getElementById('streamTitle').innerText = `${title} (S${currentSeason} E${currentEpisode})`;
                    document.getElementById('streamMeta').innerText = `Rating: ⭐ ${data.vote_average ? data.vote_average.toFixed(1) : '0.0'}`;
                    
                    if (data.seasons) {
                        const seasonObj = data.seasons.find(s => s.season_number === currentSeason);
                        maxEpisodesInSeason = seasonObj ? seasonObj.episode_count : 24;
                    }
                    
                    document.getElementById('prevEpBtn').disabled = (currentEpisode <= 1);
                    document.getElementById('nextEpBtn').disabled = (currentEpisode >= maxEpisodesInSeason);
                }
                
                document.getElementById('streamOverview').innerText = data.overview || "Sinopsis belum tersedia.";
                document.title = `Nonton ${title} - StreamAuto`;
            })
            .catch(err => console.error("Error:", err));
    }

    function navigateEpisode(direction) {
        currentEpisode += direction;
        
        if (currentEpisode < 1) currentEpisode = 1;
        if (currentEpisode > maxEpisodesInSeason) currentEpisode = maxEpisodesInSeason;

        const newUrl = `?id=${tmdbId}&type=tv&s=${currentSeason}&e=${currentEpisode}`;
        window.history.pushState({ path: newUrl }, '', newUrl);

        updatePlayerSource();
        fetchContentDetails();
    }

    function fetchRecommendations() {
        document.getElementById('recTitle').innerText = type === 'movie' ? "Rekomendasi Film Serupa 🎬" : "Rekomendasi Serial Serupa 📺";
        
        fetch(`${BASE_URL}/${type}/${tmdbId}/recommendations?api_key=${TMDB_API_KEY}&language=id-ID`)
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('recommendationGrid');
                grid.innerHTML = '';
                
                if (!data.results || data.results.length === 0) {
                    grid.innerHTML = "<p style='color:#666; grid-column: 1/-1;'>Tidak ada rekomendasi serupa.</p>";
                    return;
                }

                const limitedList = data.results.slice(0, 6);
                limitedList.forEach(item => {
                    const title = item.title || item.name;
                    const poster = item.poster_path ? `${IMAGE_BASE_URL}${item.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Image';
                    const targetUrl = `stream.html?id=${item.id}&type=${type}`;

                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <a href="${targetUrl}">
                            <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
                            <div class="movie-info">
                                <h3>${title}</h3>
                                <span class="rating">⭐ ${item.vote_average ? item.vote_average.toFixed(1) : '0.0'}</span>
                            </div>
                        </a>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(err => console.error("Error:", err));
    }
</script>
