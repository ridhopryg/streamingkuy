<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonton - StreamAuto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        
        /* Navigasi */
        .top-nav { padding: 20px; }
        .back-btn { 
            background: #1e293b; color: #38bdf8; padding: 10px 20px; 
            text-decoration: none; border-radius: 6px; font-size: 14px; 
            border: 1px solid #334155; display: inline-flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { background: #334155; }

        /* Player Area */
        .player-container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        .video-wrapper { 
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; 
            background: #000; border-radius: 8px; border: 1px solid #334155;
        }
        .video-wrapper iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }

        /* Detail Film */
        .info-section { padding: 20px 0; }
        .movie-title { font-size: 1.8em; margin-bottom: 10px; color: #fff; }
        .movie-meta { color: #94a3b8; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="back-btn">&larr; Kembali ke Beranda</a>
    </div>

    <div class="player-container">
        <div class="video-wrapper">
            <iframe id="moviePlayer" src="" allowfullscreen></iframe>
        </div>
        
        <div class="info-section">
            <h1 id="title" class="movie-title">Memuat judul...</h1>
            <p id="meta" class="movie-meta">Sedang memuat detail konten...</p>
        </div>
    </div>

    <script>
        // Mengambil ID dari URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const type = params.get('type');
        const TMDB_API_KEY = 'b9b1bba28890e19391f15763ac33de7e';

        // Mengatur sumber iframe (menggunakan Embed TMDB atau provider lainnya)
        // Catatan: Ganti dengan link streaming yang Anda gunakan
        const player = document.getElementById('moviePlayer');
        player.src = `https://www.2embed.cc/embed/${type === 'tv' ? 'series' : 'movie'}/${id}`;

        // Mengambil detail judul dari TMDB
        fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_API_KEY}&language=id-ID`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('title').innerText = data.title || data.name;
                document.getElementById('meta').innerText = `${data.release_date || data.first_air_date} • ⭐ ${data.vote_average.toFixed(1)} • ${data.genres.map(g => g.name).join(', ')}`;
            })
            .catch(() => document.getElementById('title').innerText = "Gagal memuat detail.");
    </script>
</body>
</html>
