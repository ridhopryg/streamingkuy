<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Player - StreamAuto</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
}

.stream-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.player-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 10px;
    background: #000;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    margin-bottom: 20px;
}

.player-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

.control-panel {
    background: rgba(0, 0, 0, 0.6);
    padding: 15px 20px;
    border-radius: 8px;
    margin-bottom: 20px;
    border-left: 4px solid #ff6b6b;
}

.control-panel h3 {
    margin-bottom: 12px;
    font-size: 1em;
}

.control-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 15px;
}

.control-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.server-btn, .subtitle-btn {
    padding: 8px 14px;
    background-color: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 1px solid #444;
    border-radius: 5px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.server-btn:hover, .subtitle-btn:hover {
    background-color: rgba(255, 107, 107, 0.2);
    border-color: #ff6b6b;
}

.server-btn.active, .subtitle-btn.active {
    background-color: #ff6b6b;
    border-color: #ff6b6b;
}

.translation-status {
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid #ff6b6b;
    padding: 10px 15px;
    border-radius: 5px;
    font-size: 12px;
    margin-top: 10px;
    display: none;
}

.translation-status.active {
    display: block;
}

.translation-status.loading {
    border-color: #ffa500;
    color: #ffa500;
}

.translation-status.success {
    border-color: #4caf50;
    color: #4caf50;
}

.translation-status.error {
    border-color: #ff6b6b;
    color: #ff6b6b;
}

.navigation-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    background: rgba(0, 0, 0, 0.6);
    padding: 15px 20px;
    border-radius: 8px;
    border-left: 4px solid #ff6b6b;
    flex-wrap: wrap;
    gap: 10px;
}

.nav-group {
    display: flex;
    gap: 10px;
}

.stream-btn {
    padding: 10px 20px;
    background-color: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 1px solid #444;
    border-radius: 5px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
}

.stream-btn:hover {
    background-color: rgba(255, 107, 107, 0.2);
    border-color: #ff6b6b;
}

.stream-btn.primary {
    background-color: #ff6b6b;
    border-color: #ff6b6b;
}

.stream-btn.primary:hover {
    background-color: #ff5252;
}

.stream-btn:disabled {
    background-color: rgba(0, 0, 0, 0.3);
    color: #666;
    cursor: not-allowed;
    border-color: #333;
}

.content-details {
    background: rgba(0, 0, 0, 0.6);
    padding: 25px;
    border-radius: 10px;
    border-left: 4px solid #ff6b6b;
    margin-bottom: 30px;
}

.content-details h1 {
    margin: 0 0 10px 0;
    font-size: 2em;
    color: #ff6b6b;
}

.content-details .meta {
    color: #999;
    font-size: 14px;
    margin-bottom: 15px;
}

.content-details .overview {
    color: #ccc;
    line-height: 1.6;
    font-size: 1em;
}

.section-title {
    font-size: 1.5em;
    border-left: 4px solid #ff6b6b;
    padding-left: 10px;
    margin: 40px 0 20px 0;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
}

.movie-card {
    background: rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    overflow: hidden;
    transition: all 0.3s ease;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
}

.movie-card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
}

.movie-card a {
    text-decoration: none;
    color: inherit;
    display: block;
}

.movie-card img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    transition: filter 0.3s ease;
}

.movie-card:hover img {
    filter: brightness(0.7);
}

.movie-info {
    padding: 15px;
    background: rgba(0, 0, 0, 0.8);
}

.movie-info h3 {
    font-size: 1.1em;
    margin-bottom: 8px;
    line-height: 1.4;
}

.rating {
    display: inline-block;
    background: #ff6b6b;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 0.9em;
    font-weight: bold;
}

.loading {
    text-align: center;
    padding: 50px 20px;
    font-size: 1.2em;
    color: #666;
    grid-column: 1 / -1;
}

.error-msg {
    background: rgba(255, 107, 107, 0.2);
    border: 1px solid #ff6b6b;
    color: #ff6b6b;
    padding: 15px;
    border-radius: 5px;
    margin-bottom: 20px;
}

@media (max-width: 768px) {
    .control-row {
        grid-template-columns: 1fr;
    }

    .control-group {
        flex-direction: column;
    }

    .server-btn, .subtitle-btn {
        width: 100%;
        text-align: center;
    }

    .navigation-bar {
        flex-direction: column;
        gap: 10px;
    }

    .nav-group {
        width: 100%;
    }

    .stream-btn {
        flex: 1;
        text-align: center;
    }

    .content-details h1 {
        font-size: 1.5em;
    }

    .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
    }
}

@media (max-width: 480px) {
    .stream-container {
        padding: 10px;
    }

    .content-details {
        padding: 15px;
    }

    .content-details h1 {
        font-size: 1.2em;
    }

    .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
    }

    .server-btn, .subtitle-btn {
        padding: 6px 10px;
        font-size: 11px;
    }
}
    </style>
</head>
<body>

    <div class="stream-container">
        <div class="control-panel">
            <h3>⚙️ Kontrol Player</h3>
            
            <div class="control-row">
                <div>
                    <div style="margin-bottom: 8px; font-size: 12px; color: #bbb;">🎬 Server Streaming:</div>
                    <div class="control-group" id="serverButtons"></div>
                </div>
                
                <div>
                    <div style="margin-bottom: 8px; font-size: 12px; color: #bbb;">📝 Subtitle:</div>
                    <div class="control-group" id="subtitleButtons"></div>
                </div>
            </div>

            <div class="translation-status" id="translationStatus"></div>
        </div>

        <div id="errorMsg"></div>

        <div class="player-wrapper">
            <iframe id="vidsrcEngine" src="" allowfullscreen scrolling="no"></iframe>
        </div>

        <div class="navigation-bar">
            <a href="index.html" class="stream-btn">🏠 Beranda</a>
            
            <div class="nav-group" id="tvNavGroup" style="display: none;">
                <button id="prevEpBtn" class="stream-btn" onclick="navigateEpisode(-1)">⏮️ Episode Seb</button>
                <button id="nextEpBtn" class="stream-btn primary" onclick="navigateEpisode(1)">Episode Sel ⏭️</button>
            </div>
        </div>

        <div class="content-details">
            <h1 id="streamTitle">Memuat Judul...</h1>
            <div id="streamMeta" class="meta"></div>
            <p id="streamOverview" class="overview"></p>
        </div>

        <h3 class="section-title" id="recTitle">Rekomendasi Serupa 🎬</h3>
        <div id="recommendationGrid" class="movie-grid">
            <div class="loading">Memuat rekomendasi serupa...</div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = 'b9b1bba28890e19391f15763ac33de7e'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

        // Server Streaming
        const STREAMING_SERVERS = [
            {
                name: 'VidSrc Pro',
                movie: (id) => `https://vidsrc.pro/embed/movie/${id}`,
                tv: (id, s, e) => `https://vidsrc.pro/embed/tv/${id}/${s}/${e}`,
            },
            {
                name: '2Embed',
                movie: (id) => `https://www.2embed.cc/embed/${id}`,
                tv: (id, s, e) => `https://www.2embed.cc/embedtv/${id}/${s}/${e}`,
            },
            {
                name: 'Embed.su',
                movie: (id) => `https://embed.su/embed/movie/${id}`,
                tv: (id, s, e) => `https://embed.su/embed/tv/${id}/${s}/${e}`,
            },
            {
                name: 'DbGo',
                movie: (id) => `https://www.dbgo.fun/embed/movie/${id}`,
                tv: (id, s, e) => `https://www.dbgo.fun/embed/tv/${id}/${s}/${e}`,
            },
            {
                name: 'Autoembed',
                movie: (id) => `https://autoembed.cc/embed/movie/${id}`,
                tv: (id, s, e) => `https://autoembed.cc/embed/tv/${id}/${s}/${e}`,
            }
        ];

        // Subtitle Options
        const SUBTITLE_OPTIONS = [
            { name: 'Tidak Ada', value: 'off' },
            { name: '🇮🇩 Bahasa Indonesia', value: 'id' },
            { name: '🇬🇧 English', value: 'en' }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('id');
        const type = urlParams.get('type') || 'movie'; 
        let currentSeason = parseInt(urlParams.get('s')) || 1;
        let currentEpisode = parseInt(urlParams.get('e')) || 1;
        let currentServerIndex = parseInt(urlParams.get('server')) || 0;
        let currentSubtitleLang = 'off';
        let maxEpisodesInSeason = 1;
        let isAutoTranslateActive = false;

        const playerIframe = document.getElementById('vidsrcEngine');

        if (tmdbId) {
            initializeControls();
            updatePlayerSource();
            fetchContentDetails();
            fetchRecommendations();
            checkAndEnableAutoTranslate();
        } else {
            window.location.href = 'index.html';
        }

        function initializeControls() {
            // Server Buttons
            const serverContainer = document.getElementById('serverButtons');
            serverContainer.innerHTML = '';
            STREAMING_SERVERS.forEach((server, index) => {
                const btn = document.createElement('button');
                btn.className = `server-btn ${index === currentServerIndex ? 'active' : ''}`;
                btn.innerText = server.name;
                btn.onclick = () => switchServer(index);
                serverContainer.appendChild(btn);
            });

            // Subtitle Buttons
            const subtitleContainer = document.getElementById('subtitleButtons');
            subtitleContainer.innerHTML = '';
            SUBTITLE_OPTIONS.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `subtitle-btn ${opt.value === currentSubtitleLang ? 'active' : ''}`;
                btn.innerText = opt.name;
                btn.onclick = () => switchSubtitle(opt.value);
                subtitleContainer.appendChild(btn);
            });
        }

        function switchServer(index) {
            currentServerIndex = index;
            document.querySelectorAll('.server-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentServerIndex);
            });
            updatePlayerSource();
            showErrorMsg('');
        }

        function switchSubtitle(lang) {
            currentSubtitleLang = lang;
            document.querySelectorAll('.subtitle-btn').forEach((btn, i) => {
                btn.classList.toggle('active', SUBTITLE_OPTIONS[i].value === lang);
            });
        }

        function updatePlayerSource() {
            const server = STREAMING_SERVERS[currentServerIndex];
            
            if (!server) return;

            try {
                if (type === 'movie') {
                    playerIframe.src = server.movie(tmdbId);
                    document.getElementById('tvNavGroup').style.display = 'none'; 
                } else if (type === 'tv') {
                    playerIframe.src = server.tv(tmdbId, currentSeason, currentEpisode);
                    document.getElementById('tvNavGroup').style.display = 'flex'; 
                }
                showErrorMsg('');
            } catch (err) {
                showErrorMsg('Error mengload player: ' + err.message);
            }
        }

        function showErrorMsg(msg) {
            const container = document.getElementById('errorMsg');
            if (msg) {
                container.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
            } else {
                container.innerHTML = '';
            }
        }

        function showTranslationStatus(msg, status = 'active') {
            const container = document.getElementById('translationStatus');
            if (msg) {
                container.innerText = msg;
                container.className = `translation-status ${status}`;
            } else {
                container.className = 'translation-status';
            }
        }

        // MyMemory Translation API
        async function translateWithMyMemory(text) {
            try {
                const response = await fetch(
                    `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|id`,
                    {
                        headers: {
                            'User-Agent': 'StreamAuto'
                        }
                    }
                );
                const data = await response.json();
                return data.responseData.translatedText;
            } catch (err) {
                console.error('MyMemory error:', err);
                return null;
            }
        }

        // LibreTranslate API
        async function translateWithLibreTranslate(text) {
            try {
                const response = await fetch('https://libretranslate.de/translate', {
                    method: 'POST',
                    body: JSON.stringify({
                        q: text,
                        source: 'auto',
                        target: 'id'
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                return data.translatedText;
            } catch (err) {
                console.error('LibreTranslate error:', err);
                return null;
            }
        }

        // Detect language
        async function detectLanguage(text) {
            try {
                // Simple detection - cek apakah mengandung huruf Indonesia/Melayu
                const indonesianWords = ['dan', 'yang', 'di', 'ke', 'dari', 'untuk', 'dengan', 'adalah', 'ini', 'itu', 'pada', 'oleh', 'atau', 'telah', 'akan'];
                const words = text.toLowerCase().split(/\s+/);
                const matchCount = words.filter(w => indonesianWords.includes(w)).length;
                
                if (matchCount > words.length * 0.1) {
                    return 'id'; // Indonesian
                }
                return 'en'; // English or other
            } catch (err) {
                return 'en';
            }
        }

        // Check dan auto enable translate
        async function checkAndEnableAutoTranslate() {
            showTranslationStatus('🔍 Memeriksa bahasa subtitle...', 'loading');
            
            // Tunggu sedikit untuk iframe load
            setTimeout(async () => {
                try {
                    // Coba detect bahasa dari streaming
                    // Untuk sekarang, kita assume English dan auto-translate
                    
                    // Jika ingin lebih advanced, bisa fetch subtitle data dari TMDB
                    const langDetected = 'en'; // Default: anggap English
                    
                    if (langDetected !== 'id') {
                        enableAutoTranslate();
                    } else {
                        showTranslationStatus('✅ Subtitle sudah Bahasa Indonesia', 'success');
                    }
                } catch (err) {
                    console.error('Error checking language:', err);
                    enableAutoTranslate(); // Fallback: selalu enable auto translate
                }
            }, 2000);
        }

        async function enableAutoTranslate() {
            if (isAutoTranslateActive) return;
            isAutoTranslateActive = true;

            showTranslationStatus('⏳ Mengaktifkan Auto Translate Bahasa Indonesia (MyMemory + LibreTranslate)...', 'loading');
            
            setTimeout(() => {
                try {
                    // Inject subtitle translator
                    const translatorScript = document.createElement('script');
                    translatorScript.innerHTML = `
                        (function() {
                            const subtitleCache = new Map();
                            
                            // Override subtitle display
                            const originalAddSubtitle = window.addSubtitle || function() {};
                            
                            // Listen untuk subtitle elements
                            const observer = new MutationObserver(async (mutations) => {
                                mutations.forEach((mutation) => {
                                    mutation.addedNodes.forEach((node) => {
                                        // Cek apakah ada text subtitle
                                        const subtitleText = node.textContent || node.innerText;
                                        
                                        if (subtitleText && subtitleText.length > 0 && subtitleText.length < 500) {
                                            // Hindari duplicate translation
                                            if (!subtitleCache.has(subtitleText)) {
                                                subtitleCache.set(subtitleText, true);
                                                
                                                // Emit event untuk translate
                                                window.dispatchEvent(new CustomEvent('need-translate', {
                                                    detail: { 
                                                        text: subtitleText,
                                                        element: node
                                                    }
                                                }));
                                            }
                                        }
                                    });
                                });
                            });

                            // Observe player container
                            observer.observe(document.body, {
                                childList: true,
                                subtree: true,
                                characterData: false
                            });
                        })();
                    `;
                    document.head.appendChild(translatorScript);

                    // Listen untuk translate events
                    let translateQueue = [];
                    let isTranslating = false;

                    window.addEventListener('need-translate', async (e) => {
                        const { text, element } = e.detail;
                        
                        if (translateQueue.includes(text)) return; // Hindari queue duplicate
                        translateQueue.push(text);

                        if (!isTranslating && text.trim()) {
                            isTranslating = true;
                            
                            try {
                                // Coba MyMemory dulu (lebih cepat)
                                let translated = await translateWithMyMemory(text);
                                
                                // Jika gagal, coba LibreTranslate
                                if (!translated) {
                                    translated = await translateWithLibreTranslate(text);
                                }
                                
                                if (translated && element) {
                                    // Replace text dengan translation
                                    if (element.textContent) {
                                        element.textContent = translated;
                                    } else if (element.innerText) {
                                        element.innerText = translated;
                                    }
                                    
                                    console.log('Translated:', text, '→', translated);
                                }
                            } catch (err) {
                                console.error('Translation error:', err);
                            }
                            
                            translateQueue = [];
                            isTranslating = false;
                        }
                    });

                    showTranslationStatus('✅ Auto Translate Aktif - Subtitle diterjemahkan otomatis ke Bahasa Indonesia', 'success');
                } catch (err) {
                    console.error('Error enabling translate:', err);
                    showTranslationStatus('⚠️ Auto Translate siap - Gunakan extension "Video Translate" untuk hasil optimal', 'error');
                }
            }, 800);
        }

        function fetchContentDetails() {
            fetch(`${BASE_URL}/${type}/${tmdbId}?api_key=${TMDB_API_KEY}&language=id-ID`)
                .then(res => res.json())
                .then(data => {
                    const title = data.title || data.name;
                    
                    if (type === 'movie') {
                        document.getElementById('streamTitle').innerText = title;
                        document.getElementById('streamMeta').innerText = `Rilis: ${data.release_date || 'N/A'} | Rating: ⭐ ${data.vote_average ? data.vote_average.toFixed(1) : '0.0'}`;
                    } else {
                        document.getElementById('streamTitle').innerText = `${title} (S${currentSeason} E${currentEpisode})`;
                        document.getElementById('streamMeta').innerText = `Rating: ⭐ ${data.vote_average ? data.vote_average.toFixed(1) : '0.0'}`;
                        
                        if (data.seasons) {
                            const seasonObj = data.seasons.find(s => s.season_number === currentSeason);
                            maxEpisodesInSeason = seasonObj ? seasonObj.episode_count : 24;
                        }
                        
                        document.getElementById('prevEpBtn').disabled = (currentEpisode <= 1);
                        document.getElementById('nextEpBtn').disabled = (currentEpisode >= maxEpisodesInSeason);
                    }
                    
                    document.getElementById('streamOverview').innerText = data.overview || "Sinopsis belum tersedia.";
                    document.title = `Nonton ${title} - StreamAuto`;
                })
                .catch(err => {
                    console.error("Error:", err);
                    showErrorMsg('Gagal memuat detail konten');
                });
        }

        function navigateEpisode(direction) {
            currentEpisode += direction;
            
            if (currentEpisode < 1) currentEpisode = 1;
            if (currentEpisode > maxEpisodesInSeason) currentEpisode = maxEpisodesInSeason;

            const newUrl = `?id=${tmdbId}&type=tv&s=${currentSeason}&e=${currentEpisode}&server=${currentServerIndex}`;
            window.history.pushState({ path: newUrl }, '', newUrl);

            updatePlayerSource();
            fetchContentDetails();
        }

        function fetchRecommendations() {
            document.getElementById('recTitle').innerText = type === 'movie' ? "Rekomendasi Film Serupa 🎬" : "Rekomendasi Serial Serupa 📺";
            
            fetch(`${BASE_URL}/${type}/${tmdbId}/recommendations?api_key=${TMDB_API_KEY}&language=id-ID`)
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('recommendationGrid');
                    grid.innerHTML = '';
                    
                    if (!data.results || data.results.length === 0) {
                        grid.innerHTML = "<p style='color:#666; grid-column: 1/-1;'>Tidak ada rekomendasi serupa.</p>";
                        return;
                    }

                    const limitedList = data.results.slice(0, 6);
                    limitedList.forEach(item => {
                        const title = item.title || item.name;
                        const poster = item.poster_path ? `${IMAGE_BASE_URL}${item.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Image';
                        const targetUrl = `stream.html?id=${item.id}&type=${type}&server=${currentServerIndex}`;

                        const card = document.createElement('div');
                        card.className = 'movie-card';
                        card.innerHTML = `
                            <a href="${targetUrl}">
                                <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
                                <div class="movie-info">
                                    <h3>${title}</h3>
                                    <span class="rating">⭐ ${item.vote_average ? item.vote_average.toFixed(1) : '0.0'}</span>
                                </div>
                            </a>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(err => console.error("Error:", err));
        }
    </script>
</body>

                .catch(err => console.error("Error:", err));
        }
    </script>
</body>
