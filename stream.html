<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">StreamAuto — Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080d19; --bg-card: #0f1825; --bg-hover: #182235;
            --border: #1a2b42; --border-l: #243d5a; --accent: #2f8fff;
            --text-1: #eef2ff; --text-2: #7a9abf; --text-3: #3e5573;
            --green: #22c55e; --gold: #f5a623;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-deep); color: var(--text-1); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 60px; }
        
        /* Header & Player */
        header { padding: 12px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(8,13,25,.92); }
        .hdr { max-width: 1080px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .player-wrap { max-width: 1080px; margin: 26px auto 0; padding: 0 20px; }
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* Layout */
        .srv-section { max-width: 1080px; margin: 14px auto 0; padding: 0 20px; }
        .srv-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
        .srv-btns { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
        .srv-btn { padding: 7px 13px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg-deep); color: var(--text-2); transition: .2s; }
        .srv-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    </style>
</head>
<body>

<header>
    <div class="hdr">
        <a href="index.html" style="color:var(--accent); text-decoration:none; font-weight:800;">Stream<span>Auto</span></a>
    </div>
</header>

<div class="player-wrap">
    <div class="video-box">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
    </div>
</div>

<div class="srv-section">
    <div class="srv-card">
        <div class="srv-btns" id="serverList"></div>
    </div>
</div>

<script>
    const TMDB_KEY = 'b9b1bba28890e19391f15763ac33de7e';
    const P = new URLSearchParams(window.location.search);
    const cId = P.get('id'), cType = P.get('type') || 'movie';
    let curNum = 1;

    // 1. Helper Parameter Subtitle
    function SP(style, lang) {
        if (lang === 'off') return '';
        const isID = (lang === 'id');
        const map = {
            'vsid': isID ? '?sub_id=indonesian&sub_default=1' : '?sub_id=english&sub_default=1',
            'sl_a': isID ? '&sub.lang=id&sub.default=1' : '&sub.lang=en&sub.default=1',
            'lg': isID ? '?lang=id' : '?lang=en',
            'si': isID ? '?sub_id=id' : '?sub_id=en'
        };
        return map[style] || '';
    }

    // 2. Builder URL (Penting: Harus ada sebelum dipanggil)
    function buildUrl(n, lang = 'id') {
        const id = cId;
        // Simplified mapping for demo, sesuaikan kembali dengan 20 server Anda
        const urls = {
            1: `https://vidsrc.to/embed/movie/${id}${SP('vsid', lang)}`,
            2: `https://vidsrc.me/embed/movie?tmdb=${id}${SP('sl_a', lang)}`
        };
        return urls[n] || urls[1];
    }

    // 3. Fungsi Utama
    function go(num, btn) {
        curNum = num;
        document.getElementById('videoPlayer').src = buildUrl(num, 'id');
        document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
    }

    // 4. Inisialisasi
    window.onload = () => {
        // Render tombol server contoh
        const container = document.getElementById('serverList');
        for(let i=1; i<=2; i++) {
            let b = document.createElement('button');
            b.className = 'srv-btn' + (i===1 ? ' active' : '');
            b.textContent = 'Server ' + i;
            b.onclick = function() { go(i, this); };
            container.appendChild(b);
        }
        // Jalankan player awal
        go(1);
    };
</script>
</body>
</html>
