<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Player - StreamAuto</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            background-color: #0c0c0c;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .stream-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Pembungkus Iframe Player Rasio 16:9 */
        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        /* Bar Navigasi Kontrol */
        .navigation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            background: #161616;
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid #262626;
        }
        .nav-group {
            display: flex;
            gap: 10px;
        }
        .stream-btn {
            padding: 10px 18px;
            background-color: #262626;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .stream-btn:hover {
            background-color: #363636;
        }
        .stream-btn.primary {
            background-color: #e50914;
        }
        .stream-btn.primary:hover {
            background-color: #b80710;
        }
        .stream-btn:disabled {
            background-color: #1a1a1a;
            color: #555;
            cursor: not-allowed;
        }
        /* Info Konten */
        .content-details {
            margin-top: 25px;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
        }
        .content-details h1 { margin: 0 0 5px 0; font-size: 24px; }
        .content-details .meta { color: #888; font-size: 14px; margin-bottom: 15px; }
        .content-details .overview { color: #ccc; line-height: 1.6; font-size: 16px; }
        /* Judul Section Rekomendasi */
        .section-title {
            margin-top: 40px;
            font-size: 20px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <div class="stream-container">
        <!-- 1. TEMPAT PEMUTAR VIDEO VIDSRC -->
        <div class="player-wrapper">
            <iframe id="vidsrcEngine" src="" allowfullscreen scrolling="no" sandbox="allow-forms allow-popper-handlers allow-same-origin allow-scripts flex"></iframe>
        </div>

        <!-- 2. TOMBOL-TOMBOL NAVIGASI PINTAR -->
        <div class="navigation-bar">
            <a href="index.html" class="stream-btn">🏠 Beranda</a>
            
            <!-- Grup navigasi episode (Hanya muncul/aktif jika tipenya serial 'tv') -->
            <div class="nav-group" id="tvNavGroup" style="display: none;">
                <button id="prevEpBtn" class="stream-btn" onclick="navigateEpisode(-1)">⏮️ Episode Seb</button>
                <button id="nextEpBtn" class="stream-btn primary" onclick="navigateEpisode(1)">Episode Sel ⏭️</button>
            </div>
        </div>

        <!-- 3. DETAIL INFORMASI FILM/SERIAL -->
        <div class="content-details">
            <h1 id="streamTitle">Memuat Judul...</h1>
            <div id="streamMeta" class="meta"></div>
            <p id="streamOverview" class="overview"></p>
        </div>

        <!-- 4. REKOMENDASI KONTEN SERUPA -->
        <h3 class="section-title" id="recTitle">Rekomendasi Serupa 🎬</h3>
        <div id="recommendationGrid" class="movie-grid">
            <div class="loading">Memuat rekomendasi serupa...</div>
        </div>
    </div>

    <script>
        // KUNCI KONEKSI DATA API TMDB ANDA
        const TMDB_API_KEY = 'b9b1bba28890e19391f15763ac33de7e'; 
        const BASE_URL = 'https://themoviedb.org';

        // Membaca parameter pelacakan dari URL browser
        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('id');
        const type = urlParams.get('type') || 'movie'; 
        let currentSeason = parseInt(urlParams.get('s')) || 1;
        let currentEpisode = parseInt(urlParams.get('e')) || 1;
        let maxEpisodesInSeason = 1; // Akan diisi dinamis lewat data TMDB

        const playerIframe = document.getElementById('vidsrcEngine');

        if (tmdbId) {
            updatePlayerSource();
            fetchContentDetails();
            fetchRecommendations();
        } else {
            window.location.href = 'index.html';
        }

        // Fungsi memperbarui link pemutar VidSrc secara akurat
        function updatePlayerSource() {
            if (type === 'movie') {
                playerIframe.src = `https://vidsrcme.su{tmdbId}`;
                document.getElementById('tvNavGroup').style.display = 'none'; // Sembunyikan navigasi episode
            } else if (type === 'tv') {
                playerIframe.src = `https://vidsrcme.su{tmdbId}&season=${currentSeason}&episode=${currentEpisode}`;
                document.getElementById('tvNavGroup').style.display = 'flex'; // Munculkan navigasi episode
            }
        }

        // Fungsi mengambil data info judul dan sinopsis dari TMDB
        function fetchContentDetails() {
            fetch(`${BASE_URL}/${type}/${tmdbId}?api_key=${TMDB_API_KEY}&language=id-ID`)
                .then(res => res.json())
                .then(data => {
                    const title = data.title || data.name;
                    
                    if (type === 'movie') {
                        document.getElementById('streamTitle').innerText = title;
                        document.getElementById('streamMeta').innerText = `Rilis: ${data.release_date} | Skor: ⭐ ${data.vote_average.toFixed(1)}`;
                    } else {
                        document.getElementById('streamTitle').innerText = `${title} (Season ${currentSeason} - Episode ${currentEpisode})`;
                        document.getElementById('streamMeta').innerText = `Rating Serial: ⭐ ${data.vote_average.toFixed(1)}`;
                        
                        // Tarik info season untuk membatasi navigasi tombol episode
                        const seasonObj = data.seasons.find(s => s.season_number === currentSeason);
                        maxEpisodesInSeason = seasonObj ? seasonObj.episode_count : 24;
                        
                        // Atur tombol mati/hidup jika sudah di ujung episode
                        document.getElementById('prevEpBtn').disabled = (currentEpisode <= 1);
                        document.getElementById('nextEpBtn').disabled = (currentEpisode >= maxEpisodesInSeason);
                    }
                    
                    document.getElementById('streamOverview').innerText = data.overview || "Sinopsis belum tersedia dalam Bahasa Indonesia.";
                    document.title = `Nonton ${title} - StreamAuto`;
                });
        }

        // Fungsi berpindah episode (Mundur/Maju) tanpa merestart halaman web
        function navigateEpisode(direction) {
            currentEpisode += direction;
            
            // Validasi batas pengoperan angka episode
            if (currentEpisode < 1) currentEpisode = 1;
            if (currentEpisode > maxEpisodesInSeason) currentEpisode = maxEpisodesInSeason;

            // Perbarui URL browser tanpa reload biar rapi
            const newUrl = `?id=${tmdbId}&type=tv&s=${currentSeason}&e=${currentEpisode}`;
            window.history.pushState({ path: newUrl }, '', newUrl);

            // Eksekusi pemutaran data baru
            updatePlayerSource();
            fetchContentDetails();
        }

        // Fungsi mengambil 6 rekomendasi film/serial sejenis
        function fetchRecommendations() {
            document.getElementById('recTitle').innerText = type === 'movie' ? "Rekomendasi Film Serupa 🎬" : "Rekomendasi Serial Serupa 📺";
            
            fetch(`${BASE_URL}/${type}/${tmdbId}/recommendations?api_key=${TMDB_API_KEY}&language=id-ID`)
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('recommendationGrid');
                    grid.innerHTML = '';
                    
                    const limitedList = data.results.slice(0, 6);
                    if (limitedList.length === 0) {
                        grid.innerHTML = "<p style='color:#666;'>Tidak ada rekomendasi serupa yang ditemukan.</p>";
                        return;
                    }

                    limitedList.forEach(item => {
                        const title = item.title || item.name;
                        const poster = item.poster_path ? `https://tmdb.org{item.poster_path}` : 'https://placeholder.com';
                        
                        // Menentukan parameter target klik rekomendasi baru
                        const targetUrl = `stream.html?id=${item.id}&type=${type}`;

                        const card = document.createElement('div');
                        card.className = 'movie-card';
                        card.innerHTML = `
                            <a href="${targetUrl}">
                                <img src="${poster}" alt="${title}" loading="lazy">
                                <div class="movie-info">
                                    <h3>${title}</h3>
                                    <span class="rating">⭐ ${item.vote_average.toFixed(1)}</span>
                                </div>
                            </a>
                        `;
                        grid.appendChild(card);
                    });
                });
        }
    </script>
</body>
</html>
