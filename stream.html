<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">StreamAuto — Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080d19;
            --bg-card: #0f1825;
            --bg-hover: #182235;
            --border: #1a2b42;
            --accent: #2f8fff;
            --text-1: #eef2ff;
            --text-2: #7a9abf;
            --text-3: #3e5573;
            --green: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-deep); color: var(--text-1); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 60px; }

        /* Header */
        header { background: rgba(8,13,25,.92); backdrop-filter: blur(16px); padding: 12px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 200; }
        .hdr { max-width: 1080px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; color: var(--accent); text-decoration: none; }

        /* Player */
        .player-wrap { max-width: 1080px; margin: 26px auto 0; padding: 0 20px; }
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Server & Info Section Styling */
        .srv-section, .sub-bar, .info-section { max-width: 1080px; margin: 14px auto 0; padding: 0 20px; }
        .srv-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
        .srv-btns { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
        .srv-btn { padding: 7px 13px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg-deep); color: var(--text-2); transition: all .18s; }
        .srv-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    </style>
</head>

</html>
