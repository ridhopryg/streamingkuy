<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Player - Server Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh; 
        }
        .stream-container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
        
        /* Panel Server */
        .server-panel { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            border: 1px solid #334155;
        }
        .server-panel h3 { 
            margin-bottom: 15px; 
            font-size: 1.1em; 
            color: #38bdf8; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* List Server */
        .server-list { 
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .server-row { 
            background: #0f172a;
            color: #f8fafc; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            padding: 14px 20px;
            cursor: pointer; 
            transition: all 0.2s ease; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            width: 100%;
        }
        .server-row:hover { 
            background: #1e293b; 
            border-color: #38bdf8;
        }
        .server-row.active { 
            background: #38bdf8; 
            color: #0f172a;
            font-weight: 600;
            border-color: #38bdf8;
        }
        .server-row .server-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .server-row .server-name {
            font-size: 14px;
        }
        .server-row .server-desc {
            font-size: 12px;
            opacity: 0.7;
        }
        .server-row.active .server-desc {
            opacity: 0.9;
        }
        .server-row .server-status {
            font-size: 11px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
        }
        .server-row.active .server-status {
            background: #0f172a;
            color: #38bdf8;
            border-color: #0f172a;
        }
        
        .home-btn { 
            display: inline-block;
            padding: 10px 20px; 
            background-color: #334155; 
            color: #f8fafc; 
            border: none; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            text-decoration: none; 
            transition: background 0.2s ease;
            margin-top: 5px;
        }
        .home-btn:hover { background-color: #475569; }
        
        /* Video Player */
        .player-container {
            position: relative;
            margin-bottom: 25px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            border: 1px solid #334155;
        }
        .player-wrapper { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
        }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1; }
        
        /* Upload Subtitle */
        .upload-panel {
            background: #1e293b;
            border: 1px dashed #475569;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .upload-panel span { font-size: 13px; color: #94a3b8; }
        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .btn-upload { border: 1px solid #38bdf8; color: #38bdf8; background-color: transparent; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .btn-upload:hover { background: rgba(56, 189, 248, 0.1); }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }

        /* Navigasi TV Series */
        .navigation-bar { 
            display: flex; 
            justify-content: space-between; 
            gap: 12px;
            margin-bottom: 25px; 
            display: none; 
        }
        .stream-btn { 
            padding: 12px 24px; 
            background-color: #1e293b; 
            color: #f8fafc; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .stream-btn:hover { background-color: #334155; border-color: #475569; }
        .stream-btn:disabled { background-color: #0f172a; color: #475569; cursor: not-allowed; border-color: #1e293b; }
        
        /* Detail Konten */
        .content-details { background: #1e293b; padding: 25px; border-radius: 8px; border-left: 4px solid #38bdf8; margin-bottom: 35px; border-top: 1px solid #334155; border-right: 1px solid #334155; border-bottom: 1px solid #334155; }
        .content-details h1 { margin: 0 0 10px 0; font-size: 1.6em; color: #f8fafc; font-weight: 600; }
        .content-details .meta { color: #94a3b8; font-size: 13px; margin-bottom: 15px; }
        .content-details .overview { color: #cbd5e1; line-height: 1.6; font-size: 0.95em; }
        
        /* Rekomendasi */
        .section-title { font-size: 1.2em; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; margin: 40px 0 20px 0; font-weight: 600; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .movie-card { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; transition: transform 0.2s ease; }
        .movie-card:hover { transform: translateY(-4px); border-color: #38bdf8; }
        .movie-card a { text-decoration: none; color: inherit; display: block; }
        .movie-card img { width: 100%; height: 240px; object-fit: cover; }
        .movie-info { padding: 12px; background: #1e293b; }
        .movie-info h3 { font-size: 0.85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; font-weight: 600; }
        .rating { display: inline-block; background: #38bdf8; color: #0f172a; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; font-weight: bold; }
        
        @media (max-width: 768px) { 
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
            .movie-card img { height: 190px; }
            .server-row { padding: 12px; }
            .server-row .server-status { font-size: 10px; padding: 2px 6px; }
        }
    </style>
</head>
<body>

    <div class="stream-container">
        <div class="server-panel">
            <h3>Pilihan Server</h3>
            <div id="serverList" class="server-list"></div>
            <a href="index.html" class="home-btn">Kembali ke Beranda</a>
        </div>

        <div class="upload-panel">
            <span>Subtitle tidak muncul otomatis? Unggah berkas subtitle (.srt / .vtt) Anda secara manual:</span>
            <div class="upload-btn-wrapper">
                <button class="btn-upload">Pilih Subtitle</button>
                <input type="file" id="subUploader" accept=".srt,.vtt" onchange="handleSubtitleUpload(event)">
            </div>
        </div>

        <div class="player-container">
            <div class="player-wrapper">
                <iframe id="videoPlayer" src="" allowfullscreen scrolling="no" allow="autoplay; encrypted-media"></iframe>
            </div>
        </div>

        <div class="navigation-bar" id="tvNavGroup">
            <button id="prevEpBtn" class="stream-btn" onclick="navigateEpisode(-1)">Episode Sebelumnya</button>
            <button id="nextEpBtn" class="stream-btn" onclick="navigateEpisode(1)">Episode Selanjutnya</button>
        </div>

        <div class="content-details">
            <h1 id="streamTitle">Memuat Judul...</h1>
            <div id="streamMeta" class="meta"></div>
            <p id="streamOverview" class="overview"></p>
        </div>

        <h3 class="section-title">Rekomendasi Populer</h3>
        <div id="recommendationGrid" class="movie-grid">
            <p style='color:#64748b; padding: 10px;'>Memuat data rekomendasi... ⏳</p>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = 'b9b1bba28890e19391f15763ac33de7e'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

        // DAFTAR SERVER EMBED YANG BERSIH DAN STRUKTURAL
        const STREAMING_SERVERS = [
            {
                name: 'Server 1',
                desc: 'Jalur Utama (Subtitle Bahasa Indonesia)',
                movie: (id) => `https://vidsrc.in/embed/movie/${id}?sub_lang=id`,
                tv: (id, s, e) => `https://vidsrc.in/embed/tv/${id}/${s}/${e}?sub_lang=id`
            },
            {
                name: 'Server 2',
                desc: 'Jalur Alternatif (Subtitle Bahasa Indonesia)',
                movie: (id) => `https://multiembed.mov/?video_id=${id}&tmdb=1&sub_lang=id`,
                tv: (id, s, e) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}&sub_lang=id`
            },
            {
                name: 'Server 3',
                desc: 'Jalur Cadangan (Konfigurasi Teks Manual)',
                movie: (id) => `https://multiembed.mov/?video_id=${id}&tmdb=1&sub_id=id`,
                tv: (id, s, e) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}&sub_id=id`
            },
            {
                name: 'Server 4',
                desc: 'Jalur Internasional (Vidsrc Network)',
                movie: (id) => `https://vidsrc.xyz/embed/movie?tmdb=${id}&sub_lang=id`,
                tv: (id, s, e) => `https://vidsrc.xyz/embed/tv?tmdb=${id}&season=${s}&episode=${e}&sub_lang=id`
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('id'); 
        const type = urlParams.get('type') || 'movie'; 
        let currentSeason = parseInt(urlParams.get('s')) || 1;
        let currentEpisode = parseInt(urlParams.get('e')) || 1;
        let currentServerIndex = parseInt(urlParams.get('server')) || 0;
        let maxEpisodesInSeason = 24;

        const playerIframe = document.getElementById('videoPlayer');

        if (tmdbId) {
            renderServerList();
            updatePlayerSource();
            fetchContentDetails();
            fetchPopularRecommendations();
        }

        // FUNGSI UNTUK MERENDER DAFTAR SERVER SEPERTI STRUKTUR LIST GAYA LAMA
        function renderServerList() {
            const listContainer = document.getElementById('serverList');
            listContainer.innerHTML = '';
            
            STREAMING_SERVERS.forEach((server, index) => {
                const row = document.createElement('div');
                row.className = `server-row ${index === currentServerIndex ? 'active' : ''}`;
                
                row.innerHTML = `
                    <div class="server-info">
                        <span class="server-name">${server.name}</span>
                        <span class="server-desc">${server.desc}</span>
                    </div>
                    <span class="server-status">Aktif</span>
                `;
                
                row.onclick = () => {
                    currentServerIndex = index;
                    document.querySelectorAll('.server-row').forEach((r, i) => {
                        r.classList.toggle('active', i === currentServerIndex);
                    });
                    updatePlayerSource();
                };
                
                listContainer.appendChild(row);
            });
        }

        function updatePlayerSource() {
            const server = STREAMING_SERVERS[currentServerIndex];
            if (!server) return;

            if (type === 'movie') {
                playerIframe.src = server.movie(tmdbId);
                document.getElementById('tvNavGroup').style.display = 'none'; 
            } else if (type === 'tv') {
                playerIframe.src = server.tv(tmdbId, currentSeason, currentEpisode);
                document.getElementById('tvNavGroup').style.display = 'flex'; 
            }
        }

        function handleSubtitleUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            alert("Berkas subtitle berhasil diunggah.");
        }

        function fetchContentDetails() {
            fetch(`${BASE_URL}/${type}/${tmdbId}?api_key=${TMDB_API_KEY}&language=id-ID&include_adult=true`)
                .then(res => res.json())
                .then(data => {
                    const title = data.title || data.name;
                    if(!title) return;
                    
                    if (type === 'movie') {
                        document.getElementById('streamTitle').innerText = title;
                        document.getElementById('streamMeta').innerText = `Tahun Rilis: ${data.release_date ? data.release_date.split('-')[0] : 'N/A'} | Rating: ⭐ ${data.vote_average ? data.vote_average.toFixed(1) : '0.0'}`;
                    } else {
                        document.getElementById('streamTitle').innerText = `${title} (Season ${currentSeason} - Episode ${currentEpisode})`;
                        document.getElementById('streamMeta').innerText = `Rating: ⭐ ${data.vote_average ? data.vote_average.toFixed(1) : '0.0'}`;
                        
                        if (data.seasons) {
                            const seasonObj = data.seasons.find(s => s.season_number === currentSeason);
                            maxEpisodesInSeason = seasonObj ? seasonObj.episode_count : 24;
                        }
                        document.getElementById('prevEpBtn').disabled = (currentEpisode <= 1);
                        document.getElementById('nextEpBtn').disabled = (currentEpisode >= maxEpisodesInSeason);
                    }
                    
                    document.getElementById('streamOverview').innerText = data.overview || "Sinopsis dalam bahasa Indonesia belum tersedia untuk konten ini.";
                    document.title = `Nonton ${title}`;
                })
                .catch(err => console.error(err));
        }

        function navigateEpisode(direction) {
            currentEpisode += direction;
            if (currentEpisode < 1) currentEpisode = 1;
            if (currentEpisode > maxEpisodesInSeason) currentEpisode = maxEpisodesInSeason;

            const newUrl = `?id=${tmdbId}&type=tv&s=${currentSeason}&e=${currentEpisode}&server=${currentServerIndex}`;
            window.history.pushState({ path: newUrl }, '', newUrl);

            updatePlayerSource();
            fetchContentDetails();
        }

        function fetchPopularRecommendations() {
            fetch(`${BASE_URL}/movie/popular?api_key=${TMDB_API_KEY}&language=id-ID&page=1&include_adult=true`)
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('recommendationGrid');
                    grid.innerHTML = '';
                    
                    data.results.slice(0, 6).forEach(item => {
                        const title = item.title;
                        if (!item.poster_path) return;
                        const poster = `${IMAGE_BASE_URL}${item.poster_path}`;
                        const targetUrl = `stream.html?id=${item.id}&type=movie&server=${currentServerIndex}`;

                        const card = document.createElement('div');
                        card.className = 'movie-card';
                        card.innerHTML = `
                            <a href="${targetUrl}">
                                <img src="${poster}" alt="${title}" loading="lazy">
                                <div class="movie-info">
                                    <h3>${title}</h3>
                                    <span class="rating">⭐ ${item.vote_average.toFixed(1)}</span>
                                </div>
                            </a>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(err => console.error(err));
        }
    </script>
</body>
</html>
